name: Deploy web build to Pages

# Kept separate from ci.yml on purpose. GitHub Pages has to be switched on for
# the repository (Settings -> Pages -> Source: GitHub Actions) before this can
# succeed, and a repository that has not done that should still show a green
# CI badge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: 4.4.1-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot

          cd /tmp
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export web build
        run: |
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --import
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" \
            "${GITHUB_WORKSPACE}/build/web/index.html"

      - name: Disable Jekyll
        # Without this, Pages ignores files and folders beginning with an
        # underscore, which Godot's web export can emit.
        run: touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
